services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aceden
      POSTGRES_PASSWORD: aceden
      POSTGRES_DB: aceden_ai_os
    ports: ["5432:5432"]
  api:
    build: .
    depends_on: [db]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://aceden:aceden@db:5432/aceden_ai_os
    ports: ["8000:8000"]
